# Source of truth for FeatherShot.xcodeproj. After editing, run `xcodegen generate` in ios/
# and commit both. The drawing code is shared with the Mac app by compiling the same files.
name: FeatherShot
options:
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: en
configFiles:
  Debug: Config/Version.xcconfig
  Release: Config/Version.xcconfig
settings:
  base:
    DEVELOPMENT_TEAM: XPPUZJDN56
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
targets:
  FeatherShot:
    type: application
    platform: iOS
    sources:
      - path: FeatherShot
      - path: ../Sources/DrawingShapes.swift
        group: Shared
      - path: ../Sources/EditorTheme.swift
        group: Shared
      - path: ../Sources/EditorZoom.swift
        group: Shared
    info:
      path: FeatherShot/Info.plist
      properties:
        CFBundleDisplayName: FeatherShot
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.graphics-design
        ITSAppUsesNonExemptEncryption: false
        NSPhotoLibraryAddUsageDescription: FeatherShot saves your annotated screenshots to Photos.
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiredDeviceCapabilities:
          - arm64
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.kainzmayer.feathershot
        PRODUCT_NAME: FeatherShot
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        ENABLE_PREVIEWS: YES
  FeatherShotTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FeatherShotTests
    dependencies:
      - target: FeatherShot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.kainzmayer.feathershot.tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  FeatherShot:
    build:
      targets:
        FeatherShot: all
    test:
      targets:
        - FeatherShotTests
    archive:
      config: Release
