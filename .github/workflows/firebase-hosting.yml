name: Firebase Hosting

on:
  push:
    branches:
      - main
    paths:
      - 'hosting/**'
      - 'firebase.json'
      - 'storage.rules'
      - '.firebaserc'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy Hosting
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          if [[ -z "${FIREBASE_SERVICE_ACCOUNT:-}" ]]; then
            echo "::notice::FIREBASE_SERVICE_ACCOUNT not set — skipping deploy"
            exit 0
          fi
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
          npm install -g firebase-tools
          firebase deploy --only hosting,storage --project feathershot --non-interactive
