name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ─── macOS (Native Swift) ──────────────────────────────────────────
  build-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Require Apple signing secrets
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          missing=()
          [[ -z "${CSC_LINK:-}" ]] && missing+=(CSC_LINK)
          [[ -z "${CSC_KEY_PASSWORD:-}" ]] && missing+=(CSC_KEY_PASSWORD)
          [[ -z "${APPLE_TEAM_ID:-}" ]] && missing+=(APPLE_TEAM_ID)
          if ((${#missing[@]} > 0)); then
            echo "::error::Missing GitHub Actions secrets for signed macOS releases: ${missing[*]}. See packaging/mac/README.md"
            exit 1
          fi
          if [[ -z "${APPLE_ID:-}" || -z "${APPLE_APP_SPECIFIC_PASSWORD:-}" ]]; then
            echo "::warning::APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD not set — DMG will be signed but not notarized."
          fi

      - name: Import Developer ID certificate (keychain)
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.CSC_LINK }}
          P12_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Test & Build Release Binary
        run: |
          swift test
          swift build -c release

      - name: Generate DMG Background
        run: |
          if [ -f generate_assets.swift ]; then
            swift generate_assets.swift || true
          fi
          # Create a simple background if generate_assets didn't produce one
          if [ ! -f dmg_background.png ]; then
            sips -z 400 600 icon_1024.png --out dmg_background.png 2>/dev/null || true
          fi

      - name: Preflight notarization credentials
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          trim() {
            local v="$1"
            v="${v//$'\r'/}"
            v="${v//$'\n'/}"
            v="${v#"${v%%[![:space:]]*}"}"
            v="${v%"${v##*[![:space:]]}"}"
            printf '%s' "$v"
          }
          APPLE_ID="$(trim "${APPLE_ID:-}")"
          APPLE_APP_SPECIFIC_PASSWORD="$(trim "${APPLE_APP_SPECIFIC_PASSWORD:-}")"
          APPLE_TEAM_ID="$(trim "${APPLE_TEAM_ID:-}")"
          if [[ -z "$APPLE_ID" || -z "$APPLE_APP_SPECIFIC_PASSWORD" ]]; then
            echo "::notice::Skipping notarytool preflight (notarization secrets not set)"
            exit 0
          fi
          export APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
          if ! xcrun notarytool history \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" >/dev/null; then
            echo "::warning::notarytool preflight failed (401 = regenerate app-specific password at appleid.apple.com and update GitHub secrets)"
            exit 0
          fi

      - name: Build App Bundle & DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          FEATHERSHOT_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          export FEATHERSHOT_VERSION="${FEATHERSHOT_VERSION#v}"
          chmod +x build_release.sh
          security find-identity -v -p codesigning
          ./build_release.sh

      - name: Verify macOS code signature
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          APP="FeatherShot.app"
          codesign --verify --strict --verbose=2 "$APP"
          if [[ -n "${APPLE_ID:-}" && -n "${APPLE_APP_SPECIFIC_PASSWORD:-}" ]]; then
            DMG=$(ls FeatherShot-*-\(macOS\).dmg 2>/dev/null | head -1)
            if [[ -n "$DMG" ]]; then
              xcrun stapler validate "$DMG"
            fi
            spctl -a -t exec -vv "$APP/Contents/MacOS/FeatherShot"
          else
            echo "::notice::Skipping stapler/spctl (notarization secrets not set)"
          fi

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: "FeatherShot*.dmg"

  # ─── Windows & Linux (Electron) ────────────────────────────────────
  build-electron:
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        working-directory: electron-app
        run: npm ci

      - name: Generate Platform Icons
        working-directory: electron-app
        shell: bash
        run: |
          if [[ "${{ matrix.platform }}" == "win" ]]; then
            # Windows needs .ico — use electron-icon-builder or convert with magick
            npm install --no-save png2icons 2>/dev/null || true
            npx -y electron-icon-maker --input=../icon_1024.png --output=assets 2>/dev/null || true
            # Fallback: if ico wasn't created, install imagemagick
            if [ ! -f assets/icon.ico ] && [ ! -f assets/icons/win/icon.ico ]; then
              if command -v magick >/dev/null 2>&1; then
                magick ../icon_1024.png -define icon:auto-resize=256,128,64,48,32,16 assets/icon.ico
              elif command -v convert >/dev/null 2>&1; then
                convert ../icon_1024.png -define icon:auto-resize=256,128,64,48,32,16 assets/icon.ico
              fi
            fi
            # Copy from nested output if needed
            if [ -f assets/icons/win/icon.ico ] && [ ! -f assets/icon.ico ]; then
              cp assets/icons/win/icon.ico assets/icon.ico
            fi
          fi

      - name: Build Electron App
        working-directory: electron-app
        run: npm run build:${{ matrix.platform }}
        env:
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: true

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: electron-${{ matrix.platform }}
          path: |
            electron-app/dist/*.exe
            electron-app/dist/*.deb
            electron-app/dist/*.AppImage

  # ─── Chrome Extension ──────────────────────────────────────────────
  build-chrome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package Chrome Extension
        run: |
          npm run sync:shared
          npm run verify:chrome
          cd chrome-extension
          zip -r ../FeatherShot-Chrome-Extension.zip . -x ".*"

      - name: Upload Chrome Extension
        uses: actions/upload-artifact@v4
        with:
          name: chrome-extension
          path: FeatherShot-Chrome-Extension.zip

  # ─── Create GitHub Release ─────────────────────────────────────────
  release:
    needs: [build-macos, build-electron, build-chrome]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: List artifacts
        run: find release-artifacts -type f | head -50

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-artifacts/**/*.dmg
            release-artifacts/**/*.exe
            release-artifacts/**/*.deb
            release-artifacts/**/*.AppImage
            release-artifacts/**/*.zip
