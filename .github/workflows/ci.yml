name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  swift:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build (release)
        run: swift build -c release

      - name: Test
        run: swift test

  shared:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync & verify shared letterLabel
        run: npm run verify

  electron:
    runs-on: ubuntu-latest
    needs: shared
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: electron-app/package-lock.json

      - name: Install dependencies
        working-directory: electron-app
        run: npm ci

      - name: Syntax-check main process
        working-directory: electron-app
        run: node --check main.js

      - name: Dependency audit
        working-directory: electron-app
        run: npm audit --audit-level=high

  chrome:
    runs-on: ubuntu-latest
    needs: shared
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate Chrome extension
        run: npm run verify:chrome
