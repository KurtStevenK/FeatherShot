name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  swift:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build (release)
        run: swift build -c release

      - name: Launch smoke test (menu bar item, no windows)
        run: perl -e 'alarm 60; exec @ARGV' .build/release/FeatherShot --smoke-test

      - name: Test
        run: swift test

  shared:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync & verify shared letterLabel
        run: npm run verify

  electron:
    runs-on: ubuntu-latest
    needs: shared
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: electron-app/package-lock.json

      - name: Install dependencies
        working-directory: electron-app
        run: npm ci

      - name: Syntax-check main process
        working-directory: electron-app
        run: node --check main.js

      - name: Dependency audit
        working-directory: electron-app
        run: npm audit --audit-level=high

  # Real Electron: open the editor, click Save & Copy, check Downloads and the clipboard.
  electron-save-smoke:
    needs: shared
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: electron-app/package-lock.json

      - name: Install dependencies
        working-directory: electron-app
        run: npm ci

      - name: Save & Copy smoke test (Windows)
        if: runner.os == 'Windows'
        working-directory: electron-app
        run: npx electron test/save-smoke.js

      - name: Save & Copy smoke test (Linux, Xvfb)
        if: runner.os == 'Linux'
        working-directory: electron-app
        run: xvfb-run -a npx electron --no-sandbox test/save-smoke.js

  chrome:
    runs-on: ubuntu-latest
    needs: shared
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate Chrome extension
        run: npm run verify:chrome
