<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FeatherShot — Annotate Screenshot</title>
  <link rel="stylesheet" href="editor.css">
</head>
<body>
  <div id="editor">
    <div id="canvas-container">
      <canvas id="canvas"></canvas>
      <textarea id="text-editor" class="text-editor-hidden" rows="1"></textarea>
    </div>
    <div id="toolbar">
      <div class="tool-group">
        <button id="tool-step" class="tool-btn active" title="Step Arrow (1)" aria-label="Step Arrow (Shortcut: 1)" aria-pressed="true">1→</button>
        <button id="tool-step-rect" class="tool-btn" title="Step Rectangle (2)" aria-label="Step Rectangle (Shortcut: 2)" aria-pressed="false">1▢</button>
        <button id="tool-arrow" class="tool-btn" title="Arrow (3)" aria-label="Arrow (Shortcut: 3)" aria-pressed="false">↗</button>
        <button id="tool-rect" class="tool-btn" title="Rectangle (4)" aria-label="Rectangle (Shortcut: 4)" aria-pressed="false">▢</button>
        <button id="tool-circle" class="tool-btn" title="Circle / Ellipse (5)" aria-label="Circle or Ellipse (Shortcut: 5)" aria-pressed="false">◯</button>
        <button id="tool-line" class="tool-btn" title="Line (6)" aria-label="Line (Shortcut: 6)" aria-pressed="false">╱</button>
        <button id="tool-question-arrow" class="tool-btn" title="Question Arrow (7)" aria-label="Question Arrow (Shortcut: 7)" aria-pressed="false">?→</button>
        <button id="tool-question-rect" class="tool-btn" title="Question Rectangle (8)" aria-label="Question Rectangle (Shortcut: 8)" aria-pressed="false">?▢</button>
        <button id="tool-exclamation-arrow" class="tool-btn" title="Exclamation Arrow (-)" aria-label="Exclamation Arrow (Shortcut: -)" aria-pressed="false">!→</button>
        <button id="tool-exclamation-rect" class="tool-btn" title="Exclamation Rectangle (=)" aria-label="Exclamation Rectangle (Shortcut: =)" aria-pressed="false">!▢</button>
        <button id="tool-text" class="tool-btn" title="Text (T)" aria-label="Text annotation (Shortcut: T)" aria-pressed="false">T</button>
        <button id="tool-abc-arrow" class="tool-btn" title="ABC Arrow (9)" aria-label="ABC Arrow (Shortcut: 9)" aria-pressed="false">a→</button>
        <button id="tool-abc-rect" class="tool-btn" title="ABC Rectangle (0)" aria-label="ABC Rectangle (Shortcut: 0)" aria-pressed="false">a▢</button>
        <button id="tool-magnifier" class="tool-btn" title="Magnifier (M)" aria-label="Magnifier (Shortcut: M)" aria-pressed="false">🔍</button>
      </div>
      <div class="sep"></div>
      <input type="color" id="color" value="#FF3B30" title="Color" aria-label="Color">
      <input type="range" id="width" min="2" max="15" value="4" title="Line Width" aria-label="Line Width">
      <span id="w-label" aria-hidden="true">4px</span>
      <div class="spacer"></div>
      <button id="undo" class="act" title="Undo (Ctrl+Z)" aria-label="Undo last annotation (Shortcut: Ctrl+Z)">Undo</button>
      <button id="clear" class="act danger" title="Clear All" aria-label="Clear all annotations">Clear</button>
      <button id="save" class="act primary" title="Save & Download (Ctrl+S)" aria-label="Save screenshot and download (Shortcut: Ctrl+S)">💾 Save & Download</button>
    </div>
  </div>
  <script src="letterLabel.js"></script>
  <script src="editor.js"></script>
</body>
</html>
